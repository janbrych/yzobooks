name: Deploy Next.js site to GitHub Pages

on:
  push:
    branches: ["main", "master", "feature/*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js static export
        env:
          STATIC_EXPORT: "true"
          BASE_PATH: "/yzobooks"
        run: npm run build

      - name: Verify static export artifact
        run: |
          if [ ! -f ./out/index.html ]; then
            echo "Error: ./out/index.html was not generated!"
            exit 1
          fi

          if grep -q "Get started by editing" ./out/index.html; then
            echo "Error: ./out/index.html contains default Next.js starter page content!"
            exit 1
          fi

          if ! grep -q "Knihovna" ./out/index.html; then
            echo "Error: ./out/index.html does not contain expected Yzobooks application content ('Knihovna')!"
            exit 1
          fi

          if ! grep -q "/yzobooks/_next/" ./out/index.html; then
            echo "Error: ./out/index.html does not use the expected base path '/yzobooks/_next/' for assets!"
            exit 1
          fi

          echo "Static export artifact verified successfully!"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/feature/')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
